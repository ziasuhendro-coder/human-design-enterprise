name: Deploy Edge Function - assign-license

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/assign-license/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy function via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -L -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions/deploy?slug=assign-license" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -F 'metadata={"entrypoint_path":"index.ts","name":"assign-license"};type=application/json' \
            -F "file=@supabase/functions/assign-license/index.ts;filename=index.ts"
