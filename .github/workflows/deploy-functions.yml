name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy assign-license function via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          FUNCTION_NAME="assign-license"

          curl -L -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions/deploy?slug=${FUNCTION_NAME}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -F "metadata={\"entrypoint_path\":\"index.ts\",\"name\":\"${FUNCTION_NAME}\"};type=application/json" \
            -F "file=@supabase/functions/${FUNCTION_NAME}/index.ts;filename=index.ts" \
            -w "\nHTTP Status: %{http_code}\n" \
            -o /tmp/deploy_response.json

          echo "--- Response ---"
          cat /tmp/deploy_response.json

          echo "Deploy selesai."
