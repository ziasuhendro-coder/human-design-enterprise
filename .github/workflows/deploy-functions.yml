name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy assign-license function via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          FUNCTION_NAME="assign-license"
          FUNCTION_BODY=$(cat supabase/functions/${FUNCTION_NAME}/index.ts | jq -Rs .)

          curl -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions/${FUNCTION_NAME}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"slug\": \"${FUNCTION_NAME}\",
              \"name\": \"${FUNCTION_NAME}\",
              \"verify_jwt\": true,
              \"body\": ${FUNCTION_BODY}
            }" \
            --fail-with-body
